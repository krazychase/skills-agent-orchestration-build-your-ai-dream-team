<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#project-list">Skip to projects</a>

  <main class="dashboard" id="dashboard">
    <header class="dashboard__header">
      <h1 class="dashboard__title">Project Pulse</h1>
      <p class="dashboard__subtitle">See every project's status, recent activity, and priority at a glance.</p>
    </header>

    <section class="dashboard__summary" id="pulse-summary" aria-label="Status summary"></section>

    <p class="status-message status-message--loading" id="status-message" role="status" aria-live="polite">Loading projects…</p>

    <ul class="project-grid" id="project-list" aria-label="Projects"></ul>
  </main>

  <script>
    (function () {
      "use strict";

      const DATA_URL = "project-data.json";

      const SERVE_HINT =
        "Open the dashboard over HTTP: use the \"Run Project Pulse Dashboard\" launch configuration, " +
        "or run \"python3 -m http.server 5500\" from the app folder and visit http://localhost:5500/index.html.";

      const STATUS_LABELS = {
        "on-track": "On track",
        "at-risk": "At risk",
        "blocked": "Blocked",
        "completed": "Completed",
        "planning": "Planning"
      };

      const PRIORITY_LABELS = {
        "high": "High priority",
        "medium": "Medium priority",
        "low": "Low priority"
      };

      const REQUIRED_FIELDS = ["name", "owner", "status", "recentActivity", "priority"];

      const summaryElement = document.getElementById("pulse-summary");
      const messageElement = document.getElementById("status-message");
      const listElement = document.getElementById("project-list");

      // ---------- Status message ----------

      function showMessage(kind, text) {
        messageElement.className = "status-message status-message--" + kind;
        messageElement.textContent = text;
        messageElement.hidden = false;
      }

      function hideMessage() {
        messageElement.hidden = true;
      }

      // ---------- Value helpers ----------

      function normalizeKey(value) {
        if (typeof value !== "string") {
          return "";
        }
        return value.trim().toLowerCase().replace(/\s+/g, "-");
      }

      function describeStatus(rawStatus) {
        const key = normalizeKey(rawStatus);
        if (Object.prototype.hasOwnProperty.call(STATUS_LABELS, key)) {
          return { key: key, label: STATUS_LABELS[key] };
        }
        return { key: "unknown", label: "Unknown" };
      }

      function describePriority(rawPriority) {
        const key = normalizeKey(rawPriority);
        if (Object.prototype.hasOwnProperty.call(PRIORITY_LABELS, key)) {
          return { key: key, label: PRIORITY_LABELS[key] };
        }
        return { key: "unknown", label: "Unknown" };
      }

      function isNonEmptyString(value) {
        return typeof value === "string" && value.trim() !== "";
      }

      function textOrFallback(value, fallback) {
        return isNonEmptyString(value) ? value.trim() : fallback;
      }

      // Parses "YYYY-MM-DD" as a local date (avoids the UTC off-by-one of new Date("YYYY-MM-DD")).
      function parseIsoDate(value) {
        if (typeof value !== "string") {
          return null;
        }
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value.trim());
        if (!match) {
          return null;
        }
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const date = new Date(year, month - 1, day);
        if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
          return null;
        }
        return date;
      }

      function formatDate(date) {
        return date.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      }

      function startOfToday() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
      }

      function parseProgress(value) {
        let number = value;
        if (typeof value === "string" && value.trim() !== "") {
          number = Number(value);
        }
        if (typeof number !== "number" || !Number.isFinite(number)) {
          return null;
        }
        return Math.round(Math.min(100, Math.max(0, number)));
      }

      function createElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      }

      function createLabelledLine(tagName, className, labelText, valueText) {
        const line = createElement(tagName, className);
        line.appendChild(createElement("span", "project-card__label", labelText + ": "));
        line.appendChild(document.createTextNode(valueText));
        return line;
      }

      // ---------- Validation ----------

      function warnAboutMissingFields(project, index) {
        REQUIRED_FIELDS.forEach(function (field) {
          if (!isNonEmptyString(project[field])) {
            console.warn("Project Pulse: project at index " + index + " is missing required field \"" + field + "\".");
          }
        });
      }

      function warnAboutDuplicateIds(projects) {
        const seen = new Set();
        projects.forEach(function (project, index) {
          if (project && isNonEmptyString(project.id)) {
            if (seen.has(project.id)) {
              console.warn("Project Pulse: duplicate project id \"" + project.id + "\" at index " + index + ".");
            }
            seen.add(project.id);
          }
        });
      }

      // ---------- Rendering ----------

      function renderSummary(projects) {
        const counts = {};
        Object.keys(STATUS_LABELS).forEach(function (key) {
          counts[key] = 0;
        });
        projects.forEach(function (project) {
          const status = describeStatus(project.status);
          if (status.key !== "unknown") {
            counts[status.key] += 1;
          }
        });

        summaryElement.replaceChildren();
        Object.keys(STATUS_LABELS).forEach(function (key) {
          const stat = createElement("div", "summary-stat summary-stat--" + key);
          stat.appendChild(createElement("span", "summary-stat__value", String(counts[key])));
          stat.appendChild(createElement("span", "summary-stat__label", STATUS_LABELS[key]));
          summaryElement.appendChild(stat);
        });
      }

      function buildCard(project, index) {
        warnAboutMissingFields(project, index);

        const name = textOrFallback(project.name, "Not specified");
        const owner = textOrFallback(project.owner, "Not specified");
        const recentActivity = textOrFallback(project.recentActivity, "No recent activity");
        const status = describeStatus(project.status);
        const priority = describePriority(project.priority);

        const card = createElement("article", "project-card");
        card.dataset.status = status.key;
        card.dataset.priority = priority.key;
        card.dataset.projectId = isNonEmptyString(project.id) ? project.id : "project-" + index;

        // Header: name and badges
        const header = createElement("header", "project-card__header");
        header.appendChild(createElement("h2", "project-card__name", name));
        const badges = createElement("div", "project-card__badges");
        badges.appendChild(createElement("span", "status-badge status-badge--" + status.key, status.label));
        badges.appendChild(createElement("span", "priority-badge priority-badge--" + priority.key, priority.label));
        header.appendChild(badges);
        card.appendChild(header);

        // Owner
        card.appendChild(createLabelledLine("p", "project-card__owner", "Owner", owner));

        // Optional summary
        if (isNonEmptyString(project.summary)) {
          card.appendChild(createElement("p", "project-card__summary", project.summary.trim()));
        }

        // Recent activity
        card.appendChild(createLabelledLine("p", "project-card__activity", "Recent activity", recentActivity));

        // Optional progress
        const progress = parseProgress(project.progress);
        if (progress !== null) {
          const progressWrapper = createElement("div", "project-card__progress");
          const labelId = card.dataset.projectId + "-progress-label-" + index;
          const bar = createElement("progress", "progress-bar");
          bar.max = 100;
          bar.value = progress;
          bar.setAttribute("aria-label", name + " progress");
          bar.setAttribute("aria-describedby", labelId);
          const progressLabel = createElement("span", "progress-label", progress + "% complete");
          progressLabel.id = labelId;
          progressWrapper.appendChild(bar);
          progressWrapper.appendChild(progressLabel);
          card.appendChild(progressWrapper);
        }

        // Footer: due date and last updated
        const footer = createElement("footer", "project-card__footer");
        if (project.dueDate !== undefined) {
          const dueDate = parseIsoDate(project.dueDate);
          const due = createElement("time", "project-card__due");
          due.appendChild(createElement("span", "project-card__label", "Due: "));
          if (dueDate) {
            due.setAttribute("datetime", project.dueDate.trim());
            due.appendChild(document.createTextNode(formatDate(dueDate)));
            if (dueDate < startOfToday() && status.key !== "completed") {
              // The overdue styling is visual only, so state it in text too.
              card.classList.add("is-overdue");
              due.appendChild(document.createTextNode(" · Overdue"));
            }
          } else {
            due.appendChild(document.createTextNode("Not specified"));
          }
          footer.appendChild(due);
        }

        const updatedDate = parseIsoDate(project.lastUpdated);
        const updated = createElement("time", "project-card__updated");
        updated.appendChild(createElement("span", "project-card__label", "Updated: "));
        if (updatedDate) {
          updated.setAttribute("datetime", project.lastUpdated.trim());
          updated.appendChild(document.createTextNode(formatDate(updatedDate)));
        } else {
          updated.appendChild(document.createTextNode("Not specified"));
        }
        footer.appendChild(updated);
        card.appendChild(footer);

        return card;
      }

      function renderProjects(projects) {
        listElement.replaceChildren();
        projects.forEach(function (project, index) {
          const item = createElement("li", "project-grid__item");
          item.appendChild(buildCard(project, index));
          listElement.appendChild(item);
        });
      }

      // ---------- Loading flow ----------

      async function loadDashboard() {
        renderSummary([]);
        showMessage("loading", "Loading projects…");

        if (location.protocol === "file:") {
          showMessage("error", "Project data can't load from a file:// page. " + SERVE_HINT);
          return;
        }

        let response;
        try {
          response = await fetch(DATA_URL, { cache: "no-store" });
        } catch (error) {
          console.error("Project Pulse: network error while loading " + DATA_URL, error);
          showMessage("error", "Could not reach " + DATA_URL + ". " + SERVE_HINT);
          return;
        }

        if (!response.ok) {
          showMessage("error", "Could not load " + DATA_URL + " (HTTP " + response.status + ").");
          return;
        }

        let data;
        try {
          data = await response.json();
        } catch (error) {
          console.error("Project Pulse: invalid JSON in " + DATA_URL, error);
          showMessage("error", DATA_URL + " is not valid JSON.");
          return;
        }

        if (!data || typeof data !== "object" || !Array.isArray(data.projects)) {
          showMessage("error", DATA_URL + " is missing the top-level \"projects\" array.");
          return;
        }

        const projects = data.projects.filter(function (project, index) {
          const isObject = project !== null && typeof project === "object" && !Array.isArray(project);
          if (!isObject) {
            console.warn("Project Pulse: skipping project at index " + index + " because it is not an object.");
          }
          return isObject;
        });

        if (projects.length === 0) {
          showMessage("empty", "No projects to show yet.");
          return;
        }

        warnAboutDuplicateIds(projects);
        renderSummary(projects);
        renderProjects(projects);
        hideMessage();
      }

      loadDashboard();
    })();
  </script>
</body>
</html>
